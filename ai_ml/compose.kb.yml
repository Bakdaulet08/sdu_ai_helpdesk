# Separate local development database. Existing backend DB is not changed.
services:
  kb-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sdu_kb
      POSTGRES_PASSWORD: sdu_kb_local
      POSTGRES_DB: sdu_kb
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdu_kb -d sdu_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kb-data:
